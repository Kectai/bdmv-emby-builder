name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution artifacts
        run: python -c "from pathlib import Path; assert len(list(Path('dist').glob('*.whl'))) == 1; assert len(list(Path('dist').glob('*.tar.gz'))) == 1"

      - name: Verify source distribution contents
        run: python -c "import tarfile; from pathlib import Path; names=tarfile.open(next(Path('dist').glob('*.tar.gz'))).getnames(); assert any(n.endswith('/config.example.toml') for n in names); assert any('/docs/' in n for n in names)"

      - name: Install built wheel
        run: python -c "import subprocess, sys; from pathlib import Path; subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', '--no-deps', '--force-reinstall', str(next(Path('dist').glob('*.whl')))], check=True)"

      - name: Smoke-test installed command
        run: bdmv-emby --help

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Compile sources
        run: python -m compileall -q bdmv_emby tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
